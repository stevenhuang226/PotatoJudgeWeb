debug: false
problem:
  path: "/tmp/pj_pro"
  explanation: "explanation.md"
  case_prefix: "input"
  case_suffix: ".bin"
submit:
  path: "/tmp/pj_sub"
  socket: "/tmp/pj.socket"
  maxConcurrent: 2
server:
  host: "127.0.0.1"
  port: 8080
static:
  path: "../web"

database:
  dsn: "postgres://user:pwd@host:5432/db"
  max_open_conns: 16
  max_idle_conns: 8
  conn_max_lifetime: 1h
